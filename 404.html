<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!--
      存在しないURLで表示するページ（Cloudflare Pages / GitHub Pages とも
      ルートの 404.html を 404 ステータスで返す）。どの階層のURLでも表示
      されるため、相対パスの CSS・リンクは使わず、スタイルはインラインで
      持ち、リンクは絶対URLにする。スクリプトは使わない。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
        script-src 'none';
        style-src 'unsafe-inline' https://fonts.googleapis.com;
        font-src https://fonts.gstatic.com;
        img-src 'self' data:;
        object-src 'none';
        base-uri 'none';
        form-action 'none'"
    />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#004679" />
    <meta name="color-scheme" content="light" />
    <title>ページが見つかりません – しほしけコンバーター</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --page-bg: #e7e5df;
        --card: #ffffff;
        --ink: #161b26;
        --muted: #687085;
        --primary: #1f5bd6;
        --primary-hover: #1a4fbe;
        --btn-outline-border: #cbd2de;
        --btn-outline-hover: #f1f4f9;
        --sans: "BIZ UDPGothic", -apple-system, BlinkMacSystemFont,
          "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--page-bg);
        color: var(--ink);
        font-family: var(--sans);
        line-height: 1.7;
      }
      main {
        width: 100%;
        max-width: 560px;
        background: var(--card);
        border-radius: 12px;
        padding: 40px 32px;
        text-align: center;
        box-shadow: 0 1px 3px rgb(22 27 38 / 8%);
      }
      .code {
        margin: 0;
        font-size: 56px;
        font-weight: 700;
        line-height: 1;
        color: var(--muted);
        letter-spacing: 0.04em;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 22px;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
      }
      a {
        display: inline-block;
        padding: 10px 18px;
        border-radius: 8px;
        font-weight: 700;
        text-decoration: none;
      }
      .primary {
        background: var(--primary);
        color: #fff;
      }
      .primary:hover {
        background: var(--primary-hover);
      }
      .secondary {
        border: 1px solid var(--btn-outline-border);
        color: var(--ink);
      }
      .secondary:hover {
        background: var(--btn-outline-hover);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>ページが見つかりません</h1>
      <p>
        お探しのページは移動または削除されたか、URLが間違っている可能性があります。
      </p>
      <nav aria-label="主なページ">
        <a class="primary" href="https://barexam.y-adachi.com/">論文式コンバーター</a>
        <a class="secondary" href="https://barexam.y-adachi.com/tantou">短答ダウンローダー</a>
      </nav>
    </main>
  </body>
</html>
