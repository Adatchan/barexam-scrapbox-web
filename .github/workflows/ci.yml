# プッシュ・プルリクエストごとの検査。手元のコミットフック（.githooks/pre-commit）
# を有効にしていない環境からの変更でも、版番号・検索索引の更新漏れや解析ルールの
# 退行を取りこぼさないようにする。いずれもネットワークを使わない（数秒）。
#
# リンク探索のコード（moj.js など）を変えたときだけ、法務省ページに対する
# リンク探索の健全性チェックを全年度で行う（週次巡回は最新年度だけのため）。
name: 検査

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 依存パッケージをインストール
        run: npm ci

      - name: 解析ルールの回帰テスト
        run: node scripts/test-rules.mjs

      - name: 全文検索の回帰テスト
        run: node scripts/test-search.mjs

      - name: 版番号・CSPハッシュが最新か
        run: node scripts/bump-version.mjs --check

      - name: 全文検索の索引が最新か
        run: node scripts/build-search-index.mjs --check

  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # 比較の基準は、プルリクエストなら取り込み先、main へのプッシュなら直前の状態
      - name: リンク探索のコードが変わったか
        id: changed
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if git diff --name-only "$base" HEAD 2>/dev/null |
            grep -qE '^(moj|tantou-moj|yobi-moj|rules|years|yobi-years)\.js$|^scripts/check-links\.mjs$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: リンク探索の健全性チェック（全年度）
        if: steps.changed.outputs.run == 'true'
        run: node scripts/check-links.mjs
